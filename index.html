<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EA580C">
<title>籃球教學影音庫</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="app-header__brand">
      <div class="app-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path>
        </svg>
      </div>
      <div>
        <h1 class="app-title">籃球教學影音庫</h1>
        <p class="app-subtitle" id="totalCountLabel">載入中…</p>
      </div>
    </div>
    <button class="add-btn tap" id="addBtn" aria-label="新增影片">+</button>
  </header>

  <div class="segmented-wrap">
    <div class="segmented" id="categorySegmented" role="tablist" aria-label="主分類">
      <div class="segmented__pill" id="categoryPill"></div>
    </div>
  </div>

  <div class="segmented-wrap segmented-wrap--sub" id="subWrap"></div>

  <main class="card-list" id="cardList"></main>

  <div class="toast hidden" id="toast">
    <span class="toast__text"></span>
    <button class="toast__close" id="toastClose" aria-label="關閉提示">&#10005;</button>
  </div>

</div>

<div class="modal-backdrop hidden" id="addModalBackdrop">
  <div class="modal">
    <h2>新增影片</h2>
    <form id="addForm">
      <div class="field">
        <label for="fieldUrl">影片連結</label>
        <input type="url" id="fieldUrl" name="url" placeholder="https://www.youtube.com/shorts/..." required>
      </div>
      <div class="field">
        <label for="fieldTitle">動作名稱 / 標題</label>
        <input type="text" id="fieldTitle" name="title" required>
      </div>
      <div class="field">
        <label for="fieldCategory">一級分類</label>
        <select id="fieldCategory" name="category" required>
          <option value="進攻">進攻</option>
          <option value="防守">防守</option>
          <option value="基本練習">基本練習</option>
        </select>
      </div>
      <div class="field">
        <label for="fieldSubCategory">二級標籤</label>
        <select id="fieldSubCategory" name="subCategory" required></select>
      </div>
      <div class="field">
        <label for="fieldNote">教練提醒（選填）</label>
        <textarea id="fieldNote" name="note" rows="2"></textarea>
      </div>
      <div class="modal__actions">
        <button type="button" class="modal__cancel" id="addCancelBtn">取消</button>
        <button type="submit" class="modal__submit">儲存到本機</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script src="add-video.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
